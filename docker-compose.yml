services:
  walletrack:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: walletrack-dev
    ports: 
      - "8081:8081"
    env_file: .env

    volumes:
      # Mount the project into the container
      - .:/app

      # Keep container's node_modules separate
      - /app/node_modules

      # Keep Expo cache separate
      - /app/.expo

    stdin_open: true
    tty: true

    restart: unless-stopped